name: checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  git-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: raw author and committer identity
        env:
          SHIPYARD_IDENTITY_EMAIL: ${{ vars.SHIPYARD_IDENTITY_EMAIL }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref }}
        run: |
          set -eu
          fail() {
            printf 'git-identity CI: %s\n' "$1" >&2
            exit 2
          }
          [ -n "$SHIPYARD_IDENTITY_EMAIL" ] ||
            fail "identity email variable is missing"
          [ "$(git rev-parse --is-shallow-repository)" = "false" ] ||
            fail "repository history is shallow"
          git config --local shipyard.identityEmail "$SHIPYARD_IDENTITY_EMAIL"
          trap 'git config --local --unset-all shipyard.identityEmail >/dev/null 2>&1 || true' EXIT
          case "$EVENT_NAME" in
            pull_request)
              [ -n "$BASE_SHA" ] && [ -n "$PR_HEAD_SHA" ] ||
                fail "pull request identity range is missing"
              bash scripts/check-git-identity.sh \
                --range "$BASE_SHA..$PR_HEAD_SHA" --project .
              ;;
            push)
              [ "$GITHUB_REF_NAME" = "refs/heads/main" ] && [ -n "$HEAD_SHA" ] ||
                fail "main identity revision is missing"
              bash scripts/check-git-identity.sh --all "$HEAD_SHA" --project .
              ;;
            *)
              fail "unsupported workflow event"
              ;;
          esac

  leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/leak-check.sh

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n all scripts
        run: |
          bash -n install.sh agents/lib/*.sh agents/*/runner.sh .githooks/pre-commit scripts/*.sh
      - name: py_compile generators
        run: python3 -m py_compile scripts/gen-deck-data.py

  deck-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deck data is generated from the skills (not stale)
        run: bash scripts/check-deck-fresh.sh
      - name: every installed skill and crew has authored deck content
        run: bash scripts/check-deck-complete.sh

  ticket-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every ticket lives in the folder its Status implies
        run: |
          rc=0
          bash scripts/ticket-lifecycle.sh --project . --check || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "no lifecycle layout configured here — deliberate no-op"
            exit 0
          fi
          exit "$rc"

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: bats tests
        run: bats tests/
