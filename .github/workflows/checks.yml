name: checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/leak-check.sh

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n all scripts
        run: |
          bash -n install.sh agents/lib/*.sh agents/*/runner.sh .githooks/pre-commit scripts/*.sh
      - name: py_compile generators
        run: python3 -m py_compile scripts/gen-deck-data.py

  deck-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deck data is generated from the skills (not stale)
        run: bash scripts/check-deck-fresh.sh
      - name: every installed skill and crew has authored deck content
        run: bash scripts/check-deck-complete.sh

  ticket-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every ticket lives in the folder its Status implies
        run: |
          rc=0
          bash scripts/ticket-lifecycle.sh --project . --check || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "no lifecycle layout configured here — deliberate no-op"
            exit 0
          fi
          exit "$rc"

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: bats tests
        run: bats tests/
